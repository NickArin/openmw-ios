name: build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Run current stage
        run: bash ci/run.sh

      - name: Upload sysroot artifact
        uses: actions/upload-artifact@v4
        with:
          name: sysroot
          path: sysroot
          if-no-files-found: warn

      - name: Publish results as an issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "Run: ${{ github.run_number }} (commit ${{ github.sha }})"
            echo
            cat results/summary.md 2>/dev/null || echo "no summary written"
            echo
            echo "## Static libs in sysroot"
            cat results/libs.txt 2>/dev/null || echo "none"
          } > results/issue-body.md
          python3 - <<'EOF'
          import json, urllib.request, os
          body = open('results/issue-body.md').read()[:60000]
          payload = json.dumps({"title": "CI run ${{ github.run_number }}", "body": body}).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/${{ github.repository }}/issues",
              data=payload, method="POST",
              headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                       "Accept": "application/vnd.github+json",
                       "Content-Type": "application/json"})
          print(urllib.request.urlopen(req).status)
          EOF
